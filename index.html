</style></head><body>
<div id="splash"><div class="orb"><span class="logo"></span></div><h1>TREEZY<br>TEAM</h1><p>Your studio, full screen.</p>
<button id="go">Open TREEZY TEAM</button><p style="font-size:13px;max-width:340px">Allow notifications when your browser asks, so alerts reach you even while this window is minimised.</p><button id="inst" style="display:none">Install the app</button><p id="ioshint" style="display:none;font-size:13px;max-width:340px;color:#B7D36A">On iPhone: tap the Share button, choose Add to Home Screen, then open TREEZY TEAM from your Home Screen to turn on alerts.</p><a id="alt" target="_blank" rel="noopener" href="https://script.google.com/macros/s/AKfycbwDOlmZgwVWdNAopxhCHgCKtooC08YWP5reCmqdFYb4b33vB7kRpLmOfKvEyaV9XUKc/exec">Open in a new tab instead</a></div>
<button id="en">Turn on alerts</button><div id="hot"></div><div id="bar"><button id="al">Desktop alerts</button><button id="fs">Toggle full screen</button><button onclick="document.getElementById('f').src=document.getElementById('f').src">Reload</button></div>
<script>
const URL_="https://script.google.com/macros/s/AKfycbwDOlmZgwVWdNAopxhCHgCKtooC08YWP5reCmqdFYb4b33vB7kRpLmOfKvEyaV9XUKc/exec",f=document.createElement('iframe');
f.id='f';f.setAttribute('allow','fullscreen; clipboard-write; clipboard-read');f.onload=()=>f.classList.add('on');
function launch(full){
  if(full){const d=document.documentElement,r=d.requestFullscreen||d.webkitRequestFullscreen;if(r)try{r.call(d)}catch(e){}}
  f.src=URL_;document.body.appendChild(f);document.getElementById('splash').classList.add('hide');
}
function toggleFs(){const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}
document.getElementById('go').onclick=()=>{askAlerts();launch(true)};document.getElementById('fs').onclick=toggleFs;
// installable app: Android and desktop Chrome/Edge offer a real install button
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=document.getElementById('inst');if(b)b.style.display='inline-block'});
document.getElementById('inst').onclick=async()=>{if(!ip)return;ip.prompt();try{await ip.userChoice}catch(e){}ip=null;document.getElementById('inst').style.display='none'};
addEventListener('appinstalled',()=>{document.getElementById('inst').style.display='none'});

// installed as an app: skip the splash and open straight away
if(matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone)launch(false);

// ---- desktop alerts: the app posts a message here, this page shows the notification ----
let actx,ft;const ICON=document.querySelector('link[rel=icon]').href,al=document.getElementById('al');
function ctx_(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{ctx_();[880,1175].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.16;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.16)})}catch(e){}}
function flash(t){clearInterval(ft);let on=0;ft=setInterval(()=>{document.title=(on=!on)?'\u25CF '+t:'TREEZY TEAM'},1000)}
addEventListener('focus',()=>{clearInterval(ft);document.title='TREEZY TEAM'});
function label(){al.textContent='Desktop alerts: '+(!('Notification' in window)?'not supported':Notification.permission==='granted'?'on':Notification.permission==='denied'?'blocked':'off')}
function askAlerts(){ctx_();if(!('Notification' in window))return label();
  if(Notification.permission==='denied'){alert('Desktop alerts are blocked for this page. Click the padlock next to the address bar, allow Notifications, then reload. If this file is opened from your computer rather than a web address, host it on https (for example GitHub Pages) so the browser can show notifications.');return}
  Promise.resolve(Notification.requestPermission()).then(()=>{label();ensurePush();banner()}).catch(label)}
al.onclick=()=>{if('Notification' in window&&Notification.permission==='granted')show('TREEZY TEAM','Desktop alerts are working.');else askAlerts()};label();
// ---- background watcher: this page (never throttled like the app frame) checks for news and shows system notifications ----
const BG={code:'',name:'',seen:null,last:null,at:0,busy:0};
const away=()=>document.hidden||!document.hasFocus();
function show(t,b){t=String(t||'TREEZY TEAM').slice(0,100);b=String(b||'').slice(0,200);beep();flash(t);
  if('Notification' in window&&Notification.permission==='granted')try{const n=new Notification(t,{body:b,icon:ICON,tag:'treezy',renotify:true});n.onclick=()=>{window.focus();n.close()}}catch(x){}}
async function bgPoll(){if(!BG.code||BG.busy)return;BG.busy=1;
  try{const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'poll',code:BG.code})}),j=await r.json();if(j.error)throw 0;BG.at=Date.now();BG.name=(j.me||{}).name||BG.name;
    const notes=j.notes||[],chat=j.chat||[],lastId=(chat[chat.length-1]||{}).id||'';
    if(!BG.seen){BG.seen=new Set(notes.map(x=>x.id));BG.last=lastId}   // first look only sets the baseline
    else{const fn=notes.filter(x=>!BG.seen.has(x.id)&&!x.read);notes.forEach(x=>BG.seen.add(x.id));
      let fc=[];if(!chat.length)BG.last='';else{const i=chat.findIndex(m=>m.id===BG.last);fc=(i>=0?chat.slice(i+1):BG.last===''?chat:[]).filter(m=>m.name!==BG.name);BG.last=lastId}
      if(away()&&!j.quiet){
        if(fn.length)show(fn.length>1?fn.length+' new notifications':fn[0].title,fn.length>1?'Latest: '+fn[0].title:fn[0].text);
        else if(fc.length){const l=fc[fc.length-1];show(fc.length>1?fc.length+' new messages':l.name,fc.length>1?'Latest from '+l.name:l.text)}}}
  }catch(e){}BG.busy=0}
// a worker's timer is not slowed down when the window is minimised; a lock stops the browser from freezing this page
(function(){try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},8000)'])));w.onmessage=bgPoll}catch(e){setInterval(bgPoll,8000)}
  try{navigator.locks.request('treezy-alive',()=>new Promise(()=>{}))}catch(e){}})();
// ---- push: lets the phone be reached even when the app is closed (iPhone needs the app added to the Home Screen) ----
const VAPID='BFi6sJfb9yvOF10pQwxBh5_OeY0CWLAc838nJkJEK-N_v2354R1-yLs_nSHjHlzFds_bA4D__5-IPirMKdpdf5E';
const u8=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const installed=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(ensurePush).catch(()=>{});
async function ensurePush(){try{if(!BG.code||!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||Notification.permission!=='granted')return;
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
  const key=BG.code+sub.endpoint;if(BG.pushed===key)return;
  const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'pushSub',code:BG.code,sub:sub.toJSON()})}),j=await r.json();
  if(!j.error)BG.pushed=key}catch(e){}}
// opened from the Home Screen there is no splash button, so offer one until alerts are allowed
const en=document.getElementById('en');
function banner(){en.style.display=('Notification' in window&&Notification.permission==='default'&&document.getElementById('splash').classList.contains('hide'))?'block':'none'}
en.onclick=()=>askAlerts();banner();setInterval(banner,1500);
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!installed)document.getElementById('ioshint').style.display='block';
addEventListener('message',e=>{const d=e.data;if(!d)return;
  if(d.treezy===2){if(d.code!==BG.code){BG.code=String(d.code||'');BG.seen=null;BG.last=null}bgPoll();ensurePush();return}
  if(d.treezy!==1)return;
  if(Date.now()-BG.at<30000)return; // the background watcher is working and reports this itself
  if(!away())return; // the app is in front, its own pop-up is enough
  show(d.title,d.body)});
